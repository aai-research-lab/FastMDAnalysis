# FastMDXplora resolved configuration
#
# This is the fully-merged configuration actually used for this run
# (built-in defaults + config file + command-line overrides). Feed it
# back to reproduce the exact study:
#
#   fastmdx explore --config resolved_config.yml
#
systems:
- id: s1
  system: 1L2Y
output: trpcage_100steps
include:
- setup
- simulation
- analysis
- report
setup:
  ph: 7.4
  ion_concentration_M: 0.15
simulation:
  nvt_steps: 100
  npt_steps: 0
  production_steps: 100
  timestep_fs: 0.5
  temperature_K: 100.0
  friction_per_ps: 5.0
  platform: CPU
  precision: double
  checkpoint_interval_steps: 0
  trajectory_interval_steps: 10
analysis:
  include:
  - rmsd
  - rg
report:
  title: Trp-cage 100 Step Test
