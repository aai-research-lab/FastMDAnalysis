name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for setuptools-scm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        # bash on every OS. Windows steps default to pwsh, where
        # `pip ... || echo ...` prints the fallback and STILL fails the step:
        # echo is a cmdlet, it does not reset $LASTEXITCODE, and the runner
        # exits with whatever that still holds -- pip's 1. The notice and the
        # red cross arrived together, which is how this line got here.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          # The physics too, where this platform has wheels for it. Without
          # OpenMM the suite quietly skips everything that touches it -- 24
          # membrane tests among them -- and for three rounds "low coverage"
          # has meant "the tests existed and the dependency was silently
          # absent where coverage was measured". OpenMM ships no cp39
          # Windows wheel, so this is best-effort rather than required: a
          # job that cannot install it skips those tests, which the suite
          # already does gracefully, and coverage is merged across jobs so
          # the physics lines are counted from the platforms that run them.
          python -m pip install -e ".[md]" || echo "::notice::the [md] extra has no wheels here; physics-dependent tests will skip"

      - name: Run tests
        run: |
          pytest --cov=fastmdxplora --cov-report=term-missing --cov-report=xml

      - name: CLI smoke test
        shell: bash
        run: |
          fastmdx --version
          fastmdx info
          fastmdx --cite

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
