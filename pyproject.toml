[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmdxplora"
dynamic = ["version"]
description = "FastMDXplora: Fully Automated SysTem for Molecular Dynamics eXploration"
readme = "README.md"
requires-python = ">=3.9, <3.14"
license = { text = "MIT" }
authors = [
    { name = "Adekunle Aina" },
    { name = "Derrick Kwan" },
]
maintainers = [
    { name = "Adekunle Aina" },
]
keywords = [
    "molecular-dynamics",
    "md-simulation",
    "trajectory-analysis",
    "automation",
    "orchestrator",
    "computational-chemistry",
    "biophysics",
    "structural-biology",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "pyyaml>=6.0",
    "mdtraj>=1.9.7",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pandas>=1.4",
    "python-pptx>=0.6.21",
    # Used directly to size figures on slides. python-pptx happens to require
    # it, but relying on another package's dependency is how a working install
    # becomes a broken one after an upstream release.
    "pillow>=10.0",
]

[project.optional-dependencies]
md = [
    "pdbfixer",
    "openmm>=8.0",
]
ligand = [
    "openff-toolkit>=0.16",
    "openmmforcefields>=0.12",
    # Used directly to read chemical definitions and detect ionizable groups.
    # It arrives with openff-toolkit in practice, but the dependency is real
    # and belongs here rather than being inherited by accident.
    "rdkit>=2023.3",
    # Determines a ligand's pKa in the complex rather than in isolation, which
    # is the only framing in which the question has a well-defined answer.
    "propka>=3.5",
]
# AMBER NetCDF trajectories load through scipy without this, with a warning
# that the path is slower. netCDF4 provides the fast reader.
amber = [
    "netCDF4>=1.6",
]
# UMAP is one of three dimensionality-reduction methods and the only one
# needing a package of its own.
umap = [
    "umap-learn>=0.5",
]
plumed = [
    "openmm-plumed>=1.0",
]
all = [
    "fastmdxplora[md,ligand,plumed,amber,umap]",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "python-pptx>=0.6.21",
]

[project.urls]
Homepage = "https://github.com/aai-research-lab/FastMDXplora"
Documentation = "https://fastmdxplora.readthedocs.io/en/latest/"
Repository = "https://github.com/aai-research-lab/FastMDXplora"
Issues = "https://github.com/aai-research-lab/FastMDXplora/issues"
Changelog = "https://github.com/aai-research-lab/FastMDXplora/blob/main/CHANGELOG.md"

[project.scripts]
fastmdx = "fastmdxplora.cli.main:main"
fastmdxplora = "fastmdxplora.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastmdxplora = [
    "gui/static/*",
    "gui/static/**/*",
    "gui/templates/*.html",
    "gui/templates/**/*",
]

[tool.setuptools_scm]
write_to = "src/fastmdxplora/_version.py"
fallback_version = "0.1.0"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
